name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Release tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::release tag $TAG does not match package.json version ($expected)"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - name: Committed dist/ matches the build
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ in the tagged commit is out of date. Rebuild, commit, and re-tag."
            exit 1
          fi
      - name: Upload dist/haismart-laundry-card.js to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        # The tag goes through the environment, never interpolated into the script.
        run: gh release upload "$TAG" dist/haismart-laundry-card.js --clobber
