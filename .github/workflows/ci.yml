name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle size budget
        run: npm run size
      - name: Check dist/ is up to date
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/haismart-laundry-card.js is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi

