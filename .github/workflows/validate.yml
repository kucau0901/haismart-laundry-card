name: HACS validation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      # TODO: pin to a release tag or commit SHA (not verifiable offline when this was written);
      # Dependabot (.github/dependabot.yml) keeps the other actions current.
      - uses: hacs/action@main
        with:
          category: plugin
