<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laundry Card Demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Roboto, system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #f2f4f7;
        color: #212121;
      }
      h1 {
        font-size: 20px;
        font-weight: 500;
        margin: 0 0 4px;
      }
      p.lead {
        margin: 0 0 16px;
        color: #555;
        font-size: 14px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        font-size: 14px;
      }
      .toolbar label {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .themes {
        display: grid;
        gap: 16px;
      }
      .theme {
        padding: 16px;
        border-radius: 16px;
      }
      .theme h2 {
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 500;
      }
      .scenario {
        margin-bottom: 24px;
      }
      .scenario h3 {
        font-size: 14px;
        font-weight: 500;
        margin: 0 0 2px;
        font-family: ui-monospace, monospace;
      }
      .scenario p {
        font-size: 12px;
        margin: 0 0 8px;
        opacity: 0.75;
      }
      .widths {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .cell {
        flex: none;
        max-width: 100%;
      }
      .cap {
        font-size: 11px;
        opacity: 0.6;
        margin-bottom: 4px;
      }
      /* Home Assistant default theme variables (light / dark). */
      .light {
        background: #fafafa;
        color: #212121;
        --primary-color: #03a9f4;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --text-primary-color: #ffffff;
        --disabled-text-color: #bdbdbd;
        --divider-color: rgba(0, 0, 0, 0.12);
        --card-background-color: #ffffff;
        --ha-card-background: #ffffff;
        --error-color: #db4437;
        --warning-color: #ffa600;
        --success-color: #43a047;
        --info-color: #039be5;
      }
      .dark {
        background: #111111;
        color: #e1e1e1;
        --primary-color: #03a9f4;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --text-primary-color: #ffffff;
        --disabled-text-color: #6f6f6f;
        --divider-color: rgba(225, 225, 225, 0.12);
        --card-background-color: #1c1c1c;
        --ha-card-background: #1c1c1c;
        --error-color: #ef5350;
        --warning-color: #ffa600;
        --success-color: #43a047;
        --info-color: #039be5;
      }
      ha-card {
        display: block;
        background: var(--ha-card-background, var(--card-background-color));
        border-radius: 12px;
        border: 1px solid var(--divider-color);
        box-shadow: none;
      }
      #log {
        font: 12px/1.4 ui-monospace, monospace;
        white-space: pre-wrap;
        opacity: 0.8;
        margin-top: 16px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #000;
          color: #e1e1e1;
        }
        p.lead {
          color: #aaa;
        }
      }
    </style>
  </head>
  <body>
    <h1>Haier Laundry Centre card</h1>
    <p class="lead">Every fixture scenario at phone, 600 px and compact widths, in Home Assistant's default themes. Mocked; no network calls.</p>
    <div class="toolbar">
      <label><input type="checkbox" id="ms" /> Bahasa Melayu</label>
      <label><input type="checkbox" id="h24" /> 24-hour clock</label>
      <label
        >Layout
        <select id="layout">
          <option value="auto">auto</option>
          <option value="full">full</option>
          <option value="stacked">stacked</option>
          <option value="compact">compact</option>
        </select></label
      >
      <label
        >Theme
        <select id="theme">
          <option value="light">light</option>
          <option value="dark">dark</option>
          <option value="both">both</option>
        </select></label
      >
      <label
        >Scenario
        <select id="only">
          <option value="">all</option>
        </select></label
      >
    </div>
    <div class="themes" id="themes"></div>
    <div id="log"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
